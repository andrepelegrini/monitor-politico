<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Monitor Político{% endblock %}</title>
  <link rel="stylesheet" href="{{ raiz }}/static/estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ raiz }}/index.html">Monitor Político</a>
    <nav class="casas">
      <a href="{{ raiz }}/deputados/index.html"{% if casa == "camara" %} aria-current="page"{% endif %}>Deputados</a>
      <a href="{{ raiz }}/senadores/index.html"{% if casa == "senado" %} aria-current="page"{% endif %}>Senadores</a>
    </nav>
  </header>
  <main>
    {% block conteudo %}{% endblock %}
  </main>
  <footer class="rodape">
    {% block rodape %}
    <p>Dados atualizados em {{ atualizado_em }}.</p>
    <p>Fonte: <a href="{{ fonte_url }}">{{ fonte_nome }}</a>. Este site reproduz informações públicas oficiais, sem avaliação ou opinião.</p>
    {% endblock %}
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
