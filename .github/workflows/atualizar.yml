name: Testar e atualizar dados

# O site é publicado pela Vercel a cada push na main. Este workflow só testa
# e, uma vez por dia, coleta os dados e faz commit do JSON, o que dispara o
# deploy. As coletas (deputados, senadores e votações/pauta do Congresso) são
# independentes: se uma falhar, as outras ainda são commitadas, e o site segue
# com os dados anteriores da que falhou. O job termina em erro para que a
# falha apareça no Actions. Os resumos por IA só rodam com o secret
# ANTHROPIC_API_KEY configurado e só geram resumos de proposições novas ou
# alteradas.

on:
  schedule:
    - cron: "0 9 * * 1-5" # 06:00 em Brasília, dias úteis
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  coletar:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Coletar dados da Câmara
        id: camara
        continue-on-error: true
        run: python -m monitor_politico.camara
      - name: Coletar dados do Senado
        id: senado
        continue-on-error: true
        run: python -m monitor_politico.senado
      - name: Coletar votações e pauta do Congresso
        id: congresso
        continue-on-error: true
        run: python -m monitor_politico.congresso
      - name: Gerar resumos por IA das proposições novas
        id: resumos
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Secret ANTHROPIC_API_KEY não configurado: resumos não gerados."
            exit 0
          fi
          pip install -e ".[ia]"
          python -m monitor_politico.resumos_ia
      - name: Commit dos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza dados abertos ($(date -u +%F))"
          git pull --rebase
          git push
      - name: Falhar se alguma coleta falhou
        if: steps.camara.outcome == 'failure' || steps.senado.outcome == 'failure' || steps.congresso.outcome == 'failure' || steps.resumos.outcome == 'failure'
        run: |
          echo "Câmara: ${{ steps.camara.outcome }} · Senado: ${{ steps.senado.outcome }} · Congresso: ${{ steps.congresso.outcome }} · Resumos: ${{ steps.resumos.outcome }}"
          exit 1
